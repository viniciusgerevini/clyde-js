name: Parser and Interpreter CI

on:
  push:
    branches: [ main ]
    paths:
      - interpreter/**
      - parser/**
      - cli/**
      - language_server/**
  pull_request:
    branches: [ main ]
    paths:
      - interpreter/**
      - parser/**
      - cli/**
      - language_server/**

jobs:
  parser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./parser

    strategy:
      matrix:
        node-version: [24, 26]

    steps:
    - uses: actions/checkout@v2
    - name: Parser - Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v1
      with:
        node-version: ${{ matrix.node-version }}
    # using workspace as yarn workspaces only geenrate lock files in the root
    - run: |
        cd ..
        yarn workspace @clyde-lang/parser install
        yarn workspace @clyde-lang/parser build
        yarn workspace @clyde-lang/parser lint
        yarn workspace @clyde-lang/parser fmt:check
        yarn workspace @clyde-lang/parser test --coverage

    - name: Coveralls
      uses: coverallsapp/github-action@master
      with:
        github-token: ${{ secrets.github_token }}
        flag-name: run-parser-${{ matrix.node-version }}
        parallel: true
        base-path: ./parser
        path-to-lcov: ./parser/coverage/lcov.info

  interpreter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./interpreter

    strategy:
      matrix:
        node-version: [24, 26]

    steps:
    - uses: actions/checkout@v2
    - name: Interpreter - Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v1
      with:
        node-version: ${{ matrix.node-version }}
    - run: |
        cd ..
        yarn workspace @clyde-lang/parser install
        yarn workspace @clyde-lang/parser build
        yarn workspace @clyde-lang/interpreter install
        yarn workspace @clyde-lang/interpreter build
        yarn workspace @clyde-lang/interpreter lint
        yarn workspace @clyde-lang/interpreter fmt:check
        yarn workspace @clyde-lang/interpreter test --coverage

    - name: Coveralls
      uses: coverallsapp/github-action@master
      with:
        github-token: ${{ secrets.github_token }}
        flag-name: run-interpreter-${{ matrix.node-version }}
        parallel: true
        base-path: ./interpreter
        path-to-lcov: ./interpreter/coverage/lcov.info

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cli

    strategy:
      matrix:
        node-version: [24, 26]

    steps:
    - uses: actions/checkout@v2
    - name: Parser - Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v1
      with:
          node-version: ${{ matrix.node-version }}
      # using workspace as yarn workspaces only geenrate lock files in the root
    - run: |
        cd ..
        yarn workspace @clyde-lang/parser install
        yarn workspace @clyde-lang/parser build
        yarn workspace @clyde-lang/interpreter install
        yarn workspace @clyde-lang/interpreter build
        yarn workspace @clyde-lang/cli lint
        yarn workspace @clyde-lang/cli fmt:check
        yarn workspace @clyde-lang/cli test --coverage

    - name: Coveralls
      uses: coverallsapp/github-action@master
      with:
        github-token: ${{ secrets.github_token }}
        flag-name: run-parser-${{ matrix.node-version }}
        parallel: true
        base-path: ./cli
        path-to-lcov: ./cli/coverage/lcov.info

  language_server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./language_server

    strategy:
      matrix:
        node-version: [24, 26]

    steps:
    - uses: actions/checkout@v2
    - name: Language Server - Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v1
      with:
        node-version: ${{ matrix.node-version }}
    # using workspace as yarn workspaces only geenrate lock files in the root
    - run: |
        cd ..
        yarn workspace @clyde-lang/parser install
        yarn workspace @clyde-lang/parser build
        yarn workspace @clyde-lang/language-server install
        yarn workspace @clyde-lang/language-server build
        yarn workspace @clyde-lang/language-server lint
        yarn workspace @clyde-lang/language-server fmt:check
        yarn workspace @clyde-lang/language-server test

    - name: Coveralls
      uses: coverallsapp/github-action@master
      with:
        github-token: ${{ secrets.github_token }}
        flag-name: run-parser-${{ matrix.node-version }}
        parallel: true
        base-path: ./language_server
        path-to-lcov: ./language_server/coverage/lcov.info

  finish:
    needs: [parser, interpreter, language_server]
    runs-on: ubuntu-latest
    steps:
    - name: Coveralls Finished
      uses: coverallsapp/github-action@master
      with:
        github-token: ${{ secrets.github_token }}
        parallel-finished: true
